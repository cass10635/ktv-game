<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Pop 蒐集戰 V73</title>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-auth-compat.js"></script>
    <style>
        :root { 
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent: #ff4081;
            --highlight: #00e5ff;
            --gold: #ffd700;
            --male: #2196f3;
            --female: #ff4081;
            --group: #4caf50;
        }
        body { 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-dark); 
            color: white; margin: 0; text-align: center; min-height: 100vh; padding-bottom: 80px;
        }
        
        /* 頂部資訊列 */
        .header { 
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(5px);
            padding: 10px 20px; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between;
            align-items: center;
        }
        .player-info { text-align: left;
        }
        .score-display { font-size: 20px; font-weight: bold; color: var(--gold);
        }

        /* 按鈕系統 */
        button { padding: 12px 20px;
            border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; color: white; margin: 5px 0;
        }
        .btn-main { background: linear-gradient(45deg, #ff4081, #f50057); width: 100%; font-size: 18px;
            box-shadow: 0 4px 10px rgba(245,0,87,0.3); }
        .btn-task { background: linear-gradient(45deg, #2196f3, #00e5ff);
            width: 100%; height: 60px; font-size: 20px; box-shadow: 0 4px 10px rgba(33,150,243,0.3);
        }
        .btn-sec { background: #333; border: 1px solid #555; width: 100%;
        }
        .btn-book { background: linear-gradient(45deg, #673ab7, #9c27b0); width: 100%; font-size: 18px; margin-top: 10px;
        }
        .btn-add { background: #444; color: #aaa; width: auto; padding: 5px 15px;
            font-size: 12px; }
        
        /* 歌手兌換按鈕 */
        .btn-singer-ex { 
            background: linear-gradient(45deg, #ffb300, #ff6f00);
            color: black; 
            width: 100%; margin-top: 15px; animation: pulse 1.5s infinite; 
            display: none;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02);
        } 100% { transform: scale(1); } }

        /* 頁面切換 */
        .page { display: none;
            padding: 15px; animation: fadeIn 0.3s; }
        .active { display: block;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1;
        } }

        /* 主頁歌手名冊展示 */
        .home-singer-section {
            background: #1a1a1a;
            border-radius: 12px; padding: 15px; 
            margin-bottom: 20px; border: 1px solid #333; text-align: left;
        }
        .singer-tags-container {
            display: flex;
            flex-wrap: wrap; gap: 5px; margin-top: 10px; max-height: 200px; overflow-y: auto;
        }
        .tag-display {
            font-size: 12px;
            padding: 4px 8px; border-radius: 4px; 
            display: inline-flex; align-items: center; gap: 5px;
        }
        .tag-display.m { background: rgba(33, 150, 243, 0.2); color: var(--male);
            border: 1px solid var(--male); }
        .tag-display.f { background: rgba(255, 64, 129, 0.2);
            color: var(--female); border: 1px solid var(--female); }
        .tag-display.g { background: rgba(76, 175, 80, 0.2);
            color: var(--group); border: 1px solid var(--group); }

        /* 歌手輸入列 */
        .singer-input-row { 
            background: #1e1e1e;
            padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; 
            text-align: left;
        }
        .type-select { display: flex; gap: 5px; margin-bottom: 10px;
        }
        .type-opt { 
            flex: 1;
            padding: 10px; text-align: center; border-radius: 6px; font-size: 14px; cursor: pointer; border: 1px solid #444; color: #888; transition: 0.2s;
        }
        .type-opt.active.m { background: var(--male); color: white; border-color: var(--male);
            box-shadow: 0 0 8px var(--male); }
        .type-opt.active.f { background: var(--female); color: white;
            border-color: var(--female); box-shadow: 0 0 8px var(--female); }
        .type-opt.active.g { background: var(--group);
            color: white; border-color: var(--group); box-shadow: 0 0 8px var(--group); }

        .input-field { 
            width: 100%;
            padding: 12px; background: #111; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; font-size: 16px;
        }

        /* 統一歷史標籤區 */
        .history-tags-area {
            margin-top: 8px;
            display: flex; flex-wrap: wrap; gap: 6px; 
            background: #111; padding: 8px; border-radius: 8px;
            /* V71: 標籤無數量上限，改用捲動顯示全部 */
            max-height: 190px; overflow-y: auto; align-content: flex-start;
        }
        .tag-tool-row {
            display: flex; align-items: center; gap: 8px; margin-top: 10px;
        }
        .tag-filter {
            flex: 1; font-size: 13px !important; padding: 8px !important;
        }
        .tag-count { font-size: 11px; color: #888; white-space: nowrap; }
        .quick-tag { 
            font-size: 11px;
            padding: 4px 10px; border-radius: 15px; cursor: pointer; transition: 0.2s; 
            border: 1px solid #333; opacity: 0.8;
        }
        .quick-tag:hover { transform: scale(1.05); opacity: 1;
        }
        .quick-tag.t-m { color: var(--male); border-color: var(--male); background: rgba(33, 150, 243, 0.1);
        }
        .quick-tag.t-f { color: var(--female); border-color: var(--female); background: rgba(255, 64, 129, 0.1);
        }
        .quick-tag.t-g { color: var(--group); border-color: var(--group); background: rgba(76, 175, 80, 0.1);
        }

        /* 蒐集冊 */
        .group-section { background: #1e1e1e;
            border-radius: 12px; margin-bottom: 20px; padding: 15px; border: 1px solid #333; text-align: left;
        }
        .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
            border-bottom: 1px solid #333; padding-bottom: 8px; }
        .group-name { font-size: 18px; font-weight: bold;
        }
        .group-complete { border: 2px solid var(--gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        
        .member-grid { display: grid;
            grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .member-card { 
            background: #111;
            border-radius: 8px; padding: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 90px; border: 1px solid #333; opacity: 0.4;
            cursor: default;
        }
        .member-card.owned { opacity: 1; border-color: var(--accent); cursor: pointer;
            transition: transform 0.1s; }
        .member-card.owned:active { transform: scale(0.95);
        }
        
        /* 蒐集冊小圖 (Grid) */
        .card-thumb {
            width: 50px;
            height: 50px; border-radius: 5px; background: #222; margin-bottom: 5px; 
            object-fit: cover; 
            object-position: top center;
        }

        /* Modal */
        #draw-modal, #card-view-modal { position: fixed;
            inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 500;
        }
        
        /* 卡片大圖檢視 */
        .card-view-content {
            background: #222;
            border: 2px solid var(--accent); border-radius: 15px; padding: 20px; 
            width: 90%; max-width: 320px; text-align: center; position: relative;
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.3);
        }
        .card-big-img {
            width: 100%;
            aspect-ratio: 3/4; 
            background: #000;
            object-fit: contain; 
            object-position: center;
            border-radius: 10px; margin-bottom: 15px; 
        }
        .card-big-name { font-size: 24px; font-weight: bold; color: white; margin-bottom: 5px;
        }
        .card-big-group { font-size: 14px; color: var(--highlight); margin-bottom: 15px;
        }

        .task-box { border: 1px solid var(--highlight); border-radius: 12px; padding: 20px; margin-bottom: 20px;
            background: rgba(0, 229, 255, 0.05); }
        .toast { position: fixed; top: 20%;
            left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; z-index: 1000; display: none;
        }
        
        /* NEW 標籤樣式 */
        .draw-card-wrap { position: relative; }
        .new-badge {
            position: absolute; top: -6px; left: -6px;
            background: linear-gradient(135deg, #ffd54f, #ff9800);
            color: #222; font-size: 11px; font-weight: 900;
            padding: 2px 7px; border-radius: 10px;
            box-shadow: 0 0 8px rgba(255,193,7,0.9);
            letter-spacing: 0.5px; z-index: 2;
            animation: newPulse 1s ease-in-out infinite alternate;
        }
        @keyframes newPulse {
            from { transform: scale(1); }
            to { transform: scale(1.12); }
        }
        .draw-card-wrap.is-new { border-color: #ffc107 !important; box-shadow: 0 0 12px rgba(255,193,7,0.6); }

        /* 蒐集冊：重複卡片區 */
        #book-summary {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
            padding: 12px; margin-bottom: 20px; text-align: left;
        }
        .dupe-wrap {
            display: flex; flex-wrap: wrap; gap: 6px;
            max-height: 160px; overflow-y: auto; margin-top: 8px;
        }
        .dupe-chip {
            font-size: 11px; padding: 4px 8px; border-radius: 12px; cursor: pointer;
            background: rgba(255, 215, 0, 0.12); color: var(--gold); border: 1px solid var(--gold);
        }
        .dupe-chip:hover { background: rgba(255, 215, 0, 0.25); }
        .member-card.has-dupe { border-color: var(--gold); }

        /* 抽卡結果的圖片樣式 */
        .draw-card-img {
            width: 100px;
            height: 140px; border-radius: 8px; 
            background: #000;
            object-fit: contain; 
            object-position: center;
            border: 2px solid white;
        }
        /* 累積型題目（數字／動物／姓氏／顏色／植物） */
        .collect-box {
            background: #1e1e1e; border: 1px solid var(--gold); border-radius: 10px;
            padding: 15px; margin-bottom: 15px; text-align: left;
        }
        .collect-title { font-size: 15px; font-weight: bold; color: var(--gold); margin-bottom: 8px; }
        .collect-hint { font-size: 12px; color: #aaa; margin: 8px 0; line-height: 1.6; }
        .collect-used {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
            background: #111; padding: 8px; border-radius: 8px;
            max-height: 150px; overflow-y: auto; align-content: flex-start;
        }
        .used-tag {
            font-size: 12px; padding: 4px 10px; border-radius: 15px; cursor: pointer;
            border: 1px solid var(--gold); color: var(--gold);
            background: rgba(255, 215, 0, 0.1); transition: 0.2s;
        }
        .used-tag:hover { background: rgba(255, 215, 0, 0.28); }
        .collect-preview { font-size: 13px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="header" id="ui-header" style="display:none;">
    <div class="player-info">
        <div id="display-name" style="color:var(--highlight); font-weight:bold;"></div>
        <div style="font-size:10px; color:#888;">ROOM: <span id="display-room"></span></div>
        <div id="sync-status" style="font-size:10px; margin-top:2px; cursor:pointer;" onclick="openDiagnostics()">☁️ 檢查中…</div>
    </div>
    <div style="text-align: right;">
        <div class="score-display" id="total-groups-completed">0 👑</div>
        <div id="header-card-count" style="font-size:11px; color:#aaa;">0 張</div>
    </div>
</div>

<div id="page-login" class="page active">
    <h1 style="color:var(--accent);">K-Pop 蒐集戰 V73</h1>
    <p style="color:#888; font-size:12px;">主畫面即時統計 • 累積型題目 • 自動歌手分類</p>
    <input type="text" id="inName" placeholder="你的暱稱" style="width:80%; padding:15px; background:#222; border:1px solid #444; color:white; border-radius:8px; margin-bottom:10px;">
    <input type="text" id="inRoom" placeholder="房間號碼" style="width:80%; padding:15px; background:#222; border:1px solid #444; color:white; border-radius:8px; margin-bottom:20px;">
    <button class="btn-main" onclick="initGame()">開始挑戰</button>
</div>

<div id="page-home" class="page">
    <div id="unsaved-warn" style="display:none; background:#3a1414; border:1px solid #ff5252; color:#ff8a80; border-radius:10px; padding:12px; margin-bottom:15px; font-size:13px; text-align:left; line-height:1.7;"></div>

    <div class="home-singer-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>🎤 已蒐集歌手名冊</strong>
            <span style="font-size:12px; color:#aaa;" id="unique-singer-count">0 位不重複</span>
        </div>
        <div id="home-singer-list" class="singer-tags-container"></div>
        <button id="btn-singer-exchange" class="btn-singer-ex" onclick="redeemSingers()">
            🎁 消耗 10 位不重複歌手<br>兌換 2 張【保證未擁有】卡片
        </button>
        <button id="btn-global-exchange" class="btn-singer-ex" style="background:linear-gradient(45deg, #00e5ff, #2196f3); display:none; margin-top:10px;" onclick="globalExchange()">
            ♻️ 消耗 5 張任意重複卡片<br>兌換 1 張【保證未擁有】卡片
        </button>
    </div>

    <div id="card-stat-box" style="background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:12px 15px; margin-bottom:15px; text-align:left;">
        <strong style="color:var(--highlight); font-size:14px;">🃏 我的卡片統計</strong>
        <div id="home-card-stat" style="margin-top:8px; font-size:13px; color:#ddd; line-height:1.8;"></div>
    </div>

    <button class="btn-task" onclick="startTask()">🎤 抽取挑戰任務</button>
    <button id="btn-resume-task" class="btn-sec" style="display:none; border-color:var(--highlight); color:var(--highlight); margin-top:10px;" onclick="resumeTask()">↩️ 回到目前題目</button>
    <button class="btn-book" onclick="showPage('page-book')">📕 開啟成員蒐集冊</button>
    
    <div style="margin: 20px 0;">
        <button class="btn-sec" onclick="forceSync()" style="border-color:var(--highlight); color:var(--highlight);">☁️ 立即備份到雲端</button>
        <button class="btn-sec" onclick="location.reload()" style="margin-top:10px;">登出系統</button>
    </div>

    <div id="ranking-box" style="padding:15px; background:#111; border-radius:12px; font-size:13px; text-align:left;">
        <strong style="color:var(--highlight);">📊 房間玩家進度：</strong>
        <div id="ranking-list" style="margin-top:10px;"></div>
    </div>
</div>

<div id="page-challenge" class="page">
    <h2 style="color:var(--highlight);">挑戰任務</h2>
    <div class="task-box">
        <div id="task-desc" style="font-size:24px; font-weight:bold; margin-bottom:10px;"></div>
        <div id="task-extra" style="font-size:28px; color:var(--gold); font-weight:900; white-space: pre-wrap;"></div>
        <p id="task-reward" style="color:#aaa;"></p>
        <div id="task-collect-info" style="display:none; text-align:left; font-size:13px; color:#aaa; border-top:1px dashed #444; padding-top:10px; margin-top:5px;"></div>
    </div>
    <button class="btn-main" onclick="goToSettlement()">✅ 挑戰成功 (前往登錄)</button>
    <button class="btn-sec" onclick="rerollTask()">🎲 消耗1位隨機歌手重抽</button>
    <button class="btn-sec" style="border-color:var(--highlight); color:var(--highlight);" onclick="keepAndHome()">🏠 回主畫面（保留題目）</button>
    <button class="btn-sec" onclick="abandonTask()">🚫 放棄返回（題目作廢）</button>
</div>

<div id="page-settle" class="page">
    <h2 style="color:var(--group);">歌手登錄結算</h2>
    <div id="collect-box" style="display:none;"></div>
    <p style="color:#888; font-size:14px;">點擊下方標籤可快速輸入</p>
    
    <div id="singer-input-container"></div>

    <button class="btn-add" onclick="addSingerInputRow()">＋ 新增演唱歌手 (合唱)</button>
    
    <div style="margin-top:30px;">
        <button class="btn-main" style="background:var(--group);" onclick="finalizeSettlement()">確認登錄並抽卡</button>
    </div>
</div>

<div id="page-book" class="page" style="padding-top: 0;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; position: sticky; top: 0; background: var(--bg-dark); padding: 15px 0; z-index: 100; border-bottom: 1px solid #333;">
        <h2 style="margin:0;">成員蒐集冊</h2>
        <button class="btn-sec" style="width:auto; margin:0;" onclick="showPage('page-home')">返回</button>
    </div>
    <div id="book-summary"></div>
    <div id="collection-container"></div>
</div>

<div id="draw-modal">
    <div style="text-align:center;">
        <h2 style="color:var(--gold);">✨ 獲得成員卡片！</h2>
        <div id="draw-results" style="display:flex; flex-wrap:wrap; justify-content:center;"></div>
        <button class="btn-main" style="margin-top:20px; width:200px;" onclick="closeDrawModal()">收進口袋</button>
    </div>
</div>

<div id="diag-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.96); display:none; z-index:900; overflow-y:auto; padding:20px; box-sizing:border-box;">
    <div style="max-width:540px; margin:0 auto; text-align:left;">
        <h3 style="color:var(--accent); margin-top:0;">☁️ 雲端同步診斷</h3>
        <div id="diag-out" style="font-size:12px; white-space:pre-wrap; word-break:break-word; background:#111; border:1px solid #333; border-radius:8px; padding:12px; line-height:1.8; font-family:monospace;"></div>
        <button class="btn-sec" style="margin-top:12px;" onclick="runDiagnostics()">🔄 重新檢測</button>
        <button class="btn-sec" onclick="copyDiagnostics()">📋 複製檢測結果</button>
        <button class="btn-main" onclick="document.getElementById('diag-modal').style.display='none'">關閉</button>
    </div>
</div>

<div id="card-view-modal" onclick="closeCardView()">
    <div class="card-view-content" onclick="event.stopPropagation()">
        <img id="view-img" class="card-big-img" src="" alt="Card Image">
        <div id="view-name" class="card-big-name"></div>
        <div id="view-group" class="card-big-group"></div>
        <button class="btn-sec" onclick="closeCardView()">關閉</button>
    </div>
</div>

let dataRev = 0;           // 存檔版本號：每次存檔 +1，用來判斷雲端／本機哪一份比較新
let lastSyncError = null;  // 最近一次同步錯誤（顯示在診斷畫面）

// Firebase key 不允許 . # $ [ ] / 與控制字元，統一由此過濾
const FIREBASE_ILLEGAL = /[\.\$#\[\]\/\x00-\x1F\x7F]/;
function sanitizeFirebaseKey(str) {
    return (str || "").replace(/[\.\$#\[\]\/\x00-\x1F\x7F]/g, '_');
}
function getSafeKey(g, m) {
    return sanitizeFirebaseKey(g + "_" + m);
}

// ===== 共用查詢 helper（集中重複邏輯，方便維護）=====
function isGroupComplete(g) {
    return GIRL_GROUPS[g].every(m => collection[getSafeKey(g, m)]);
}
function getCompletedGroupCount() {
    let c = 0;
    for (let g in GIRL_GROUPS) if (isGroupComplete(g)) c++;
    return c;
}
// 取得所有「尚未擁有」的成員卡池
function getUnownedPool() {
    const pool = [];
    for (let g in GIRL_GROUPS) {
        GIRL_GROUPS[g].forEach(m => {
            const k = getSafeKey(g, m);
            if (!collection[k]) pool.push({ g, m, k });
        });
    }
    return pool;
}
// 計算「不重複」卡片張數（可用於自己或其他玩家的 collection）
function countUniqueOwned(col) {
    col = col || {};
    let n = 0;
    for (let g in GIRL_GROUPS) {
        GIRL_GROUPS[g].forEach(m => { if ((col[getSafeKey(g, m)] || 0) > 0) n++; });
    }
    return n;
}
// 計算「重複」卡片張數（超出第一張的部分）
function countDupes(col) {
    col = col || {};
    let total = 0;
    for (let g in GIRL_GROUPS) {
        GIRL_GROUPS[g].forEach(m => {
            const num = col[getSafeKey(g, m)] || 0;
            if (num > 1) total += (num - 1);
        });
    }
    return total;
}
// 卡池總數（所有成員數）
function getTotalMemberCount() {
    let n = 0;
    for (let g in GIRL_GROUPS) n += GIRL_GROUPS[g].length;
    return n;
}
// 計算可消耗的重複卡片總數
function getTotalDupes() {
    return countDupes(collection);
}
// 從 m/f/g 任一清單移除一筆指定歌手（只移除一筆），回傳是否成功
function removeSingerOnce(name) {
    for (const type of ['m', 'f', 'g']) {
        const arr = singers[type];
        const idx = arr ? arr.indexOf(name) : -1;
        if (idx !== -1) { arr.splice(idx, 1); return true; }
    }
    return false;
}

// ===== 資料正規化：Firebase 讀回來的陣列可能變成物件／有空洞，統一整理 =====
// 這是「卡片張數不會增加 / 玩家沒出現在列表」的主因之一：
// 一旦資料裡混進 undefined，db.update() 會「同步丟出例外」，
// 導致後面的 renderCollection() 完全沒執行、雲端也沒寫進去。
function normalizeCollection(col) {
    const out = {};
    if (!col || typeof col !== 'object') return out;
    for (const k in col) {
        if (!Object.prototype.hasOwnProperty.call(col, k)) continue;
        const n = Math.floor(Number(col[k]));
        if (isFinite(n) && n > 0) out[k] = n;
    }
    return out;
}
function normalizeNameList(v) {
    if (!v) return [];
    const arr = Array.isArray(v) ? v : Object.values(v);
    const out = [];
    arr.forEach(x => {
        if (typeof x !== 'string') return;
        const t = x.trim();
        if (t) out.push(t);
    });
    return out;
}
function normalizeSingerMap(v) {
    const out = { m: [], f: [], g: [] };
    if (v && typeof v === 'object') {
        ['m', 'f', 'g'].forEach(t => { out[t] = normalizeNameList(v[t]); });
    }
    return out;
}
function normalizeCollectLog(v) {
    const out = {};
    COLLECT_KEYS.forEach(k => {
        const list = normalizeNameList(v ? v[k] : null);
        const seen = new Set();
        const uniq = [];
        list.forEach(x => {
            const n = normCollect(x);
            if (n && !seen.has(n)) { seen.add(n); uniq.push(x); }
        });
        out[k] = uniq;
    });
    return out;
}
// 寫入 Firebase 前深層清理：移除 undefined / null / 非法 key，避免同步時丟例外
function cleanForFirebase(v) {
    if (Array.isArray(v)) {
        return v.filter(x => x !== undefined && x !== null).map(cleanForFirebase);
    }
    if (v && typeof v === 'object') {
        const out = {};
        for (const k in v) {
            if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
            const val = v[k];
            if (val === undefined || val === null) continue;
            if (!k || FIREBASE_ILLEGAL.test(k)) continue;
            out[k] = cleanForFirebase(val);
        }
        return out;
    }
    if (typeof v === 'number' && !isFinite(v)) return 0;
    return v;
}

// ===== 累積型題目（數字 / 動物 / 姓氏 / 顏色 / 植物）=====
// 比對用正規化：去空白、英文轉小寫、全形數字英數轉半形
function normCollect(v) {
    return (v == null ? "" : String(v))
        .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/\s+/g, "")
        .trim()
        .toLowerCase();
}
function getCollectStep(ck) {
    return (COLLECT_META[ck] && COLLECT_META[ck].step) || 3;
}
function getCollectList(ck) {
    if (!collectLog || !Array.isArray(collectLog[ck])) return [];
    return collectLog[ck];
}
function collectHasValue(ck, val) {
    const n = normCollect(val);
    if (!n) return false;
    return getCollectList(ck).some(x => normCollect(x) === n);
}
// 回傳這次輸入可獲得的卡片數
function calcCollectReward(ck, val) {
    const step = getCollectStep(ck);
    if (!normCollect(val)) return 1;
    if (collectHasValue(ck, val)) return 1;          // 用過的答案：固定 1 張
    const total = getCollectList(ck).length + 1;      // 加上這次的新答案
    return 1 + Math.floor(total / step);
}

const firebaseConfig = { apiKey: "AIzaSyBjYdhxIQ_LGoNHiAkygjkIqWsb8NgF0s8", authDomain: "ktv-game.firebaseapp.com", databaseURL: "https://ktv-game-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "ktv-game", storageBucket: "ktv-game.firebasestorage.app", messagingSenderId: "903538372328", appId: "1:903538372328:web:2456e55fcd41f0899f635d" };
// ⚠️ 安全提醒：web config 放前端是正常的，真正的防線是 Realtime Database「規則」。
// 本版已搭配「匿名登入」，請務必到 Firebase 主控台把規則改成需要 auth != null
// （見對話中提供的規則 JSON），否則資料庫仍是全開狀態。
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function initGame() {
    const rawName = document.getElementById('inName').value.trim();
    const rawRoom = document.getElementById('inRoom').value.trim();
    if (!rawName || !rawRoom) return alert("請填寫資訊");

    // 擋掉 Firebase 不允許的字元，避免 db.ref() 同步崩潰
    if (FIREBASE_ILLEGAL.test(rawName) || FIREBASE_ILLEGAL.test(rawRoom)) {
        return alert("暱稱與房號不能包含這些字元： .  #  $  [  ]  / 以及控制字元");
    }
    myName = rawName;
    myRoom = rawRoom;

    // ====== 新增：先做匿名登入，才符合需要 auth != null 的安全規則 ======
    firebase.auth().signInAnonymously().then(() => {
        const playerRef = db.ref(`rooms/${myRoom}/players/${myName}`);
        return playerRef.once('value').then(snap => {
            const data = snap.val() || {};

            // 讀本機備份（只是後援；手機上可能完全沒有，一切以雲端為準）
            const readLocal = (part, fallback) => {
                const v = lsRead(part);
                return (v === null || v === undefined) ? fallback : v;
            };

            // ===== 用「存檔版本號 rev」決定要採用雲端還是本機那一份 =====
            // 之前的寫法是「雲端只要有 collection 就用雲端」，
            // 一旦雲端寫入失敗（紅燈），雲端會停在舊的一份，
            // 重開就會用舊的雲端資料蓋掉本機較新的紀錄 → 剛抽的卡片就消失了。
            const cloudRev = Number(data.rev) || 0;
            const localRev = Number(readLocal('rev', 0)) || 0;
            const cloudHas = !!(data.collection || data.singers || data.singerHistory || data.collectLog || cloudRev);
            const localHas = (lsRead('col') !== null) || localRev > 0;

            let useLocal;
            if (cloudHas && localHas)      useLocal = localRev > cloudRev;   // 本機比較新才用本機
            else if (localHas && !cloudHas) useLocal = true;                 // 雲端沒東西
            else                            useLocal = false;                // 以雲端為準

            if (useLocal) {
                collection    = normalizeCollection(readLocal('col', {}));
                singers       = normalizeSingerMap(readLocal('sin', null));
                singerHistory = normalizeSingerMap(readLocal('his', null));
                collectLog    = normalizeCollectLog(readLocal('clog', null));
                dataRev       = localRev;
            } else {
                collection    = normalizeCollection(data.collection);
                singers       = normalizeSingerMap(data.singers);
                singerHistory = normalizeSingerMap(data.singerHistory);
                collectLog    = normalizeCollectLog(data.collectLog);
                dataRev       = cloudRev;
            }

            // collectLog 與歷史歌手只會越來越多，兩邊直接聯集，永遠不會因為選錯來源而遺失
            const otherLog  = normalizeCollectLog(useLocal ? data.collectLog : readLocal('clog', null));
            COLLECT_KEYS.forEach(k => {
                otherLog[k].forEach(v => {
                    if (!collectHasValue(k, v)) collectLog[k].push(v);
                });
            });
            const otherHist = normalizeSingerMap(useLocal ? data.singerHistory : readLocal('his', null));
            ['m', 'f', 'g'].forEach(t => {
                otherHist[t].forEach(n => {
                    if (!singerHistory[t].includes(n)) singerHistory[t].push(n);
                });
            });

            // 歷史歌手清單也要包含目前擁有的歌手（舊資料修補，不會刪任何東西）
            ['m', 'f', 'g'].forEach(t => {
                singers[t].forEach(n => {
                    if (!singerHistory[t].includes(n)) singerHistory[t].push(n);
                });
            });

            // 還原「保留中的題目」：跟著上面選到的那一份走
            let savedTask = useLocal ? readLocal('task', null) : (data.currentTask || null);
            if (!savedTask) savedTask = useLocal ? (data.currentTask || null) : readLocal('task', null);
            currentTask = (savedTask && savedTask.t) ? migrateTask(savedTask) : null;

            document.getElementById('display-name').textContent = myName;
            document.getElementById('display-room').textContent = myRoom;
            document.getElementById('ui-header').style.display = 'flex';

            // 讀取成功後才解鎖寫入，之後的每次變更都會寫回雲端
            cloudLoaded = true;

            // 避免重複綁定 ranking 監聽器
            if (rankingRef) rankingRef.off();
            rankingRef = db.ref(`rooms/${myRoom}/players`);
            rankingRef.on('value', s => updateRanking(s.val()));

            watchConnection();

            // 一律走 syncData：畫面 → 本機 → 雲端，確保三邊一致
            showPage('page-home');
            syncData();
            clearLegacyLocal();   // 舊版備份已搬進「房號+暱稱」的新 key，移除避免跨房汙染
            if (useLocal && localRev > cloudRev) {
                showToast("已從本機備份還原較新的紀錄，正在補傳到雲端");
            }
        });
    }).catch(e => {
        // 匿名登入失敗或讀取房間資料失敗都會進來這裡
        console.error("連線/登入失敗:", e);
        // 重要：讀取失敗時把身分清空並保持鎖定，確保不會有任何寫入蓋掉雲端上的舊紀錄
        cloudLoaded = false;
        myName = ""; myRoom = "";
        alert("連線失敗，紀錄沒有被更動。請檢查網路後再按一次「開始挑戰」。\n（若持續失敗，請確認 Firebase 已啟用『匿名』登入方式）");
    });
}

// 監看 Firebase 連線狀態：斷線會提示，重新連上會自動把未同步的變更補送
let connRef = null;
function watchConnection() {
    if (connRef) return;
    try {
        connRef = db.ref('.info/connected');
        connRef.on('value', snap => {
            isOnline = !!snap.val();
            if (isOnline) {
                if (pendingSync) pushCloud();
                else setSyncStatus('ok');
            } else {
                setSyncStatus('offline');
            }
        });
    } catch (e) { console.warn("無法監看連線狀態:", e); }
}

// 手機切到背景／關掉分頁前，再補送一次，降低來不及寫入的機會
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && pendingSync) { saveLocal(); pushCloud(); }
});
window.addEventListener('beforeunload', () => {
    if (pendingSync) { saveLocal(); pushCloud(); }
});

// syncData 拆成三段：畫面更新 → 本機備份 → 雲端同步
// 這樣就算雲端寫入失敗（規則、網路、資料異常），畫面與蒐集冊也一定是正確的
function syncData() {
    dataRev++;          // 每次存檔都往上加，本機與雲端會寫入同一個版本號
    refreshUI();
    saveLocal();        // 先寫本機（一定會成功，是最後的保命符）
    pushCloud();        // 再寫雲端（失敗會自動重試）
}

// ===== 畫面更新（完全只依賴本機狀態，不受 Firebase 影響）=====
function refreshUI() {
    const comp = getCompletedGroupCount();
    const uniqueCount = getUniqueSingerCount();
    const uniqCards = countUniqueOwned(collection);
    const dupeCards = countDupes(collection);
    const totalCards = uniqCards + dupeCards;
    const totalMembers = getTotalMemberCount();

    const compEl = document.getElementById('total-groups-completed');
    if (compEl) compEl.textContent = `${comp} 👑`;

    const headEl = document.getElementById('header-card-count');
    if (headEl) headEl.textContent = `${totalCards} 張（不重複 ${uniqCards}）`;

    const singerEl = document.getElementById('unique-singer-count');
    if (singerEl) singerEl.textContent = `${uniqueCount} 位不重複`;

    const statEl = document.getElementById('home-card-stat');
    if (statEl) {
        const pct = totalMembers ? Math.round(uniqCards / totalMembers * 1000) / 10 : 0;
        statEl.innerHTML = "";
        const l1 = document.createElement('div');
        l1.innerHTML = `不重複卡片：<b style="color:var(--highlight);">${uniqCards}</b> / ${totalMembers} 張（${pct}%）`;
        const l2 = document.createElement('div');
        l2.innerHTML = `重複卡片：<b style="color:var(--gold);">${dupeCards}</b> 張　總持有：<b>${totalCards}</b> 張`;
        const l3 = document.createElement('div');
        l3.innerHTML = `集滿團體：<b style="color:var(--gold);">${comp}</b> 團 👑`;
        statEl.append(l1, l2, l3);
    }

    const exBtn = document.getElementById('btn-singer-exchange');
    if(exBtn) exBtn.style.display = uniqueCount >= 10 ? 'block' : 'none';

    const dupesBtn = document.getElementById('btn-global-exchange');
    if (dupesBtn) {
        if (dupeCards >= 5) {
            dupesBtn.style.display = 'block';
            dupesBtn.innerHTML = `♻️ 消耗 5 張任意重複卡片 (目前 ${dupeCards} 張)<br>兌換 1 張【保證未擁有】卡片`;
        } else {
            dupesBtn.style.display = 'none';
        }
    }

    renderHomeSingers();
    updateResumeBtn();
    renderRanking();   // 讓自己的名字與張數立刻出現，不必等雲端回傳
    renderCollection();
}

// ===== 本機備份 key =====
// 新版用「房號 + 暱稱」分開存，避免不同房間的紀錄互相汙染；
// 同時保留舊版只有暱稱的 key，讓 V72 以前的存檔還讀得到（紀錄可延續）。
function lsKeyNew(part) { return `v73_${part}_${myRoom}_${myName}`; }
function lsKeyOld(part) { return `v70_${part}_${myName}`; }

function lsRead(part) {
    if (!myName) return null;
    for (const k of [lsKeyNew(part), lsKeyOld(part)]) {
        try {
            const raw = localStorage.getItem(k);
            if (raw === null) continue;
            const v = JSON.parse(raw);
            if (v !== null && v !== undefined) return v;
        } catch (e) { /* 手機隱私模式可能整個不能用，忽略 */ }
    }
    return null;
}
function lsWrite(part, value) {
    if (!myName) return;
    // 只寫「房號 + 暱稱」的新 key。舊 key 只讀不寫，並在成功載入後清掉，
    // 避免 A 房的備份在進 B 房時被誤當成 B 房的紀錄。
    try { localStorage.setItem(lsKeyNew(part), JSON.stringify(value)); } catch (e) {}
}
// 舊版 key 只當一次性搬家用：搬完就移除
function clearLegacyLocal() {
    if (!myName) return;
    ['col', 'sin', 'his', 'clog', 'task'].forEach(part => {
        try { localStorage.removeItem(lsKeyOld(part)); } catch (e) {}
    });
}
function lsRemove(part) {
    if (!myName) return;
    try { localStorage.removeItem(lsKeyNew(part)); } catch (e) {}
    try { localStorage.removeItem(lsKeyOld(part)); } catch (e) {}
}

function saveLocal() {
    if (!myName) return;
    lsWrite('col', collection);
    lsWrite('sin', singers);
    lsWrite('his', singerHistory);
    lsWrite('clog', collectLog);
    lsWrite('rev', dataRev);
    lsWrite('at', Date.now());
}

function pushCloud() {
    if (!myName || !myRoom) return;
    // 關鍵保護：還沒成功讀完雲端資料前，一律不寫入
    // （否則網路慢／讀取失敗時，會用空白的 collection 蓋掉雲端上的舊紀錄）
    if (!cloudLoaded) return;

    let payload;
    try {
        payload = buildPayload();
    } catch (e) {
        console.error("組裝同步資料失敗:", e);
        pendingSync = true;
        lastSyncError = { code: 'BUILD_FAILED', message: String(e && e.message || e) };
        setSyncStatus('fail');
        return;
    }

    pendingSync = true;
    setSyncStatus('saving');

    try {
        db.ref(`rooms/${myRoom}/players/${myName}`).update(payload)
          .then(() => {
              pendingSync = false;
              lastSyncError = null;
              setSyncStatus('ok');
          })
          .catch(e => {
              console.error("Firebase 同步失敗:", e);
              lastSyncError = describeError(e);
              setSyncStatus('fail');
              scheduleRetry();
          });
    } catch (e) {
        console.error("Firebase 同步發生例外:", e);
        lastSyncError = describeError(e);
        setSyncStatus('fail');
        scheduleRetry();
    }
}

// 統一組裝要上傳的資料：空的物件／陣列直接不送，避免不必要的刪除與寫入錯誤
function buildPayload() {
    const notEmpty = (o) => {
        if (Array.isArray(o)) return o.length > 0;
        return o && typeof o === 'object' && Object.keys(o).length > 0;
    };
    const raw = {
        name: myName,
        rev: dataRev,
        completedGroups: getCompletedGroupCount(),
        cardCount: countUniqueOwned(collection) + countDupes(collection), // 總張數（含重複，舊版相容）
        uniqueCards: countUniqueOwned(collection),                        // 不重複張數（排行榜顯示用）
        dupeCards: countDupes(collection),                                // 重複張數
        lastActive: Date.now()
    };
    const col  = cleanForFirebase(collection);
    const sin  = cleanForFirebase(singers);
    const his  = cleanForFirebase(singerHistory);
    const clog = cleanForFirebase(collectLog);
    if (notEmpty(col))  raw.collection    = col;
    if (notEmpty(sin))  raw.singers       = sin;
    if (notEmpty(his))  raw.singerHistory = his;
    if (notEmpty(clog)) raw.collectLog    = clog;
    return raw;
}

function describeError(e) {
    return {
        code: (e && (e.code || e.name)) || 'UNKNOWN',
        message: (e && e.message) || String(e),
        at: new Date().toLocaleTimeString('zh-TW')
    };
}

// 失敗後每 8 秒自動重試，直到成功
function scheduleRetry() {
    if (syncTimer) return;
    syncTimer = setInterval(() => {
        if (!pendingSync) { clearInterval(syncTimer); syncTimer = null; return; }
        pushCloud();
    }, 8000);
}

// 手動立即備份（點標題列的同步狀態或主畫面按鈕）
function forceSync() {
    if (!myName || !myRoom) return;
    if (!cloudLoaded) { showToast("還沒讀取到雲端資料，請稍候或重新登入"); return; }
    saveLocal();
    pushCloud();
    showToast("正在備份到雲端…");
}

function setSyncStatus(state) {
    const el = document.getElementById('sync-status');
    if (el) {
        if (!isOnline) {
            el.textContent = "📴 離線中，點此診斷";
            el.style.color = "#ff9800";
        } else if (state === 'saving') {
            el.textContent = "⏳ 同步中…"; el.style.color = "#888";
        } else if (state === 'ok') {
            el.textContent = "☁️ 已備份到雲端"; el.style.color = "var(--group)";
        } else if (state === 'fail') {
            const code = lastSyncError && lastSyncError.code ? ` ${lastSyncError.code}` : "";
            el.textContent = `⚠️ 同步失敗${code}・點此診斷`;
            el.style.color = "#ff5252";
        } else {
            el.textContent = "☁️ 檢查中…"; el.style.color = "#888";
        }
    }
    updateUnsavedWarn();
}

// ==================== 任務流程 ====================
// 舊版保留中的題目（例如 V72 的 type:"num"）轉成新格式，避免結算時卡住
function migrateTask(task) {
    if (!task) return null;
    const out = {
        t: task.t,
        n: Number(task.n) || 1,
        type: task.type || null,
        extra: task.extra || "",
        st: task.st || null,
        ck: task.ck || null
    };
    if (out.type === "num" || out.t === "歌名要有數字：") {
        out.t = "歌名要有【數字】";
        out.type = "collect";
        out.ck = "num";
        out.n = 1;
        out.extra = "";
    }
    if (out.type === "collect" && !COLLECT_META[out.ck]) {
        // 找不到對應設定就退回單純題目，不讓玩家卡死
        out.type = null;
        out.ck = null;
    }
    return out;
}

function startTask(force) {
    // 已有保留中的題目時，先確認避免誤觸洗掉題目
    if(currentTask && !force) {
        if(!confirm("目前還有保留中的題目，重新抽取會放棄它。確定要重抽嗎？")) return;
    }

    const t = TASKS[Math.floor(Math.random() * TASKS.length)];
    let extra = "";
    
    if(t.type === "zy") {
        extra = VALID_ZHUYIN[Math.floor(Math.random() * VALID_ZHUYIN.length)];
    } else if(t.type === "lyric") {
        const songObj = LYRICS_DB[Math.floor(Math.random() * LYRICS_DB.length)];
        const randomLine = songObj.lines[Math.floor(Math.random() * songObj.lines.length)];
        extra = `\n"${randomLine}"`;
    }
    // collect 型不再給隨機答案，由挑戰者自己選擇

    // 明確組出乾淨物件，避免 undefined 欄位讓 Firebase 寫入失敗
    currentTask = {
        t: t.t,
        n: t.n,
        type: t.type || null,
        extra: extra,
        st: t.st || null,
        ck: t.ck || null
    };
    persistTask();
    renderTaskPage();
    showPage('page-challenge');
}

// 依 currentTask 把挑戰頁畫出來（重新整理後也能還原）
function renderTaskPage() {
    if(!currentTask) return;
    document.getElementById('task-desc').textContent = currentTask.t;
    document.getElementById('task-extra').textContent = currentTask.extra || "";

    const info = document.getElementById('task-collect-info');
    if(currentTask.type === "collect" && COLLECT_META[currentTask.ck]) {
        const ck = currentTask.ck;
        const meta = COLLECT_META[ck];
        const used = getCollectList(ck);
        const step = meta.step;
        const nextReward = 1 + Math.floor((used.length + 1) / step);

        document.getElementById('task-reward').textContent =
            `獎勵：基礎 1 張（用過的答案固定 1 張）／新答案最多 ${nextReward} 張`;

        info.style.display = 'block';
        info.innerHTML = "";

        const rule = document.createElement('div');
        rule.style.cssText = "color:#ccc; line-height:1.7;";
        rule.textContent = `規則：由你自己決定要用哪一個${meta.label}。累積不同的${meta.label}每 ${step} 個，就多給 1 張卡片；如果用的是以前用過的${meta.label}，這次只給 1 張。`;
        info.appendChild(rule);

        const title = document.createElement('div');
        title.style.cssText = "margin-top:8px; color:var(--gold); font-weight:bold;";
        title.textContent = `已使用過的${meta.label}（${used.length} 個）`;
        info.appendChild(title);

        const wrap = document.createElement('div');
        wrap.className = "collect-used";
        if(used.length === 0) {
            const empty = document.createElement('span');
            empty.style.cssText = "font-size:12px; color:#666;";
            empty.textContent = `還沒有使用過任何${meta.label}，這次不管用哪個都算新的`;
            wrap.appendChild(empty);
        } else {
            used.forEach(v => {
                const tag = document.createElement('span');
                tag.className = "used-tag";
                tag.textContent = v;
                wrap.appendChild(tag);
            });
        }
        info.appendChild(wrap);
    } else {
        document.getElementById('task-reward').textContent = `獎勵：${currentTask.n} 張卡片`;
        info.style.display = 'none';
        info.innerHTML = "";
    }
}

function rerollTask() {
    const all = [...(singers.m||[]), ...(singers.f||[]), ...(singers.g||[])];
    if(all.length < 1) return alert("沒有歌手可以消耗");

    syncData();

}

function redeemSingers() {
    const uniqueNames = [...new Set([...(singers.m||[]), ...(singers.f||[]), ...(singers.g||[])])];
    if(uniqueNames.length < 10) return;

    const unownedPool = getUnownedPool();
    if(unownedPool.length < 2) {
        return alert("目前您未擁有的成員卡片不足 2 張，無法執行此保底兌換！");
    }

    if(!confirm("確定要消耗 10 位不同歌手，換取 2 張【保證全新未擁有】的卡片嗎？")) return;

    uniqueNames.slice(0, 10).forEach(name => removeSingerOnce(name));

    const drawn = [];
    for(let i=0; i<2; i++) {
        const idx = Math.floor(Math.random() * unownedPool.length);
        const p = unownedPool.splice(idx, 1)[0];
        collection[p.k] = (collection[p.k] || 0) + 1;
        drawn.push({...p, isNew: true});
    }

    renderDrawResult(drawn);
    syncData();
    showToast("兌換成功！獲得 2 張全新成員卡！");
}

function globalExchange() {
    const totalDupes = getTotalDupes();
    if(totalDupes < 5) return alert("重複卡片總數不足 5 張！");

    const unownedPool = getUnownedPool();
    if(unownedPool.length === 0) return alert("您已經集滿所有卡片了！無需再兌換。");

    if(!confirm(`確定要消耗 5 張任意重複卡片，換取 1 張【保證未擁有】的卡片嗎？`)) return;

    let neededDeduction = 5;
    for(let g in GIRL_GROUPS) {
        for(let i=0; i<GIRL_GROUPS[g].length; i++) {
            const k = getSafeKey(g, GIRL_GROUPS[g][i]);
            const num = collection[k] || 0;
            if(num > 1) {
                const toDeduct = Math.min(neededDeduction, num - 1);
                collection[k] -= toDeduct;
                neededDeduction -= toDeduct;
                if(neededDeduction <= 0) break;
            }
        }
        if(neededDeduction <= 0) break;
    }

    const target = unownedPool[Math.floor(Math.random() * unownedPool.length)];
    collection[target.k] = (collection[target.k] || 0) + 1;

    renderDrawResult([{...target, isNew: true}]);
    syncData();
    showToast("兌換成功！獲得 1 張全新成員卡！");
}

// ===== 結算頁：累積型題目的答案輸入區 =====
function renderCollectBox() {
    const box = document.getElementById('collect-box');
    if(!box) return;
    box.innerHTML = "";

    if(!currentTask || currentTask.type !== "collect" || !COLLECT_META[currentTask.ck]) {
        box.style.display = 'none';
        return;
    }

    const ck = currentTask.ck;
    const meta = COLLECT_META[ck];
    const used = getCollectList(ck);

    box.style.display = 'block';
    box.className = "collect-box";

    const title = document.createElement('div');
    title.className = "collect-title";
    title.textContent = `請輸入這次歌名裡用的【${meta.label}】`;
    box.appendChild(title);

    const input = document.createElement('input');
    input.type = "text";
    input.className = "input-field";
    input.id = "collect-input";
    input.placeholder = meta.ph;
    box.appendChild(input);

    const hint = document.createElement('div');
    hint.className = "collect-hint";
    hint.textContent = `累積不同的${meta.label}每 ${meta.step} 個 → 多給 1 張卡片；輸入以前用過的${meta.label} → 固定只給 1 張。目前已累積 ${used.length} 個。`;
    box.appendChild(hint);

    const usedTitle = document.createElement('div');
    usedTitle.style.cssText = "font-size:12px; color:var(--gold); font-weight:bold;";
    usedTitle.textContent = `曾經用過的${meta.label}（點一下可直接填入）`;
    box.appendChild(usedTitle);

    const wrap = document.createElement('div');
    wrap.className = "collect-used";
    if(used.length === 0) {
        const empty = document.createElement('span');
        empty.style.cssText = "font-size:12px; color:#666;";
        empty.textContent = `尚無紀錄`;
        wrap.appendChild(empty);
    } else {
        used.forEach(v => {
            const tag = document.createElement('span');
            tag.className = "used-tag";
            tag.textContent = v;
            tag.onclick = () => { input.value = v; updateCollectPreview(); };
            wrap.appendChild(tag);
        });
    }
    box.appendChild(wrap);

    const preview = document.createElement('div');
    preview.className = "collect-preview";
    preview.id = "collect-preview";
    box.appendChild(preview);

    input.oninput = updateCollectPreview;
    updateCollectPreview();
}

function updateCollectPreview() {
    const preview = document.getElementById('collect-preview');
    const input = document.getElementById('collect-input');
    if(!preview || !input || !currentTask || currentTask.type !== "collect") return;

    const ck = currentTask.ck;
    const meta = COLLECT_META[ck];
    const val = input.value;

    if(!normCollect(val)) {
        preview.style.color = "#888";
        preview.textContent = `尚未輸入${meta.label}`;
        return;
    }
    const reward = calcCollectReward(ck, val);
    if(collectHasValue(ck, val)) {
        preview.style.color = "var(--gold)";
        preview.textContent = `♻️ 這個${meta.label}用過了 → 獲得 1 張卡片`;
    } else {
        const total = getCollectList(ck).length + 1;
        const need = meta.step - (total % meta.step);
        preview.style.color = "var(--highlight)";
        preview.textContent = `✨ 新的${meta.label}！累積將達 ${total} 個 → 獲得 ${reward} 張卡片` +
            (need === meta.step ? "（剛好達成新的一階！）" : `（再 ${need} 個不同的${meta.label}可再多 1 張）`);
    }
}

window.renderAllHistoryTags = function(rowId, keyword) {
    const container = document.getElementById(`tags-${rowId}`);
    if(!container) return;
    container.innerHTML = "";

    const allTags = [];
    
    (singerHistory.m||[]).forEach(n => allTags.push({name:n, type:'m'}));
    (singerHistory.f||[]).forEach(n => allTags.push({name:n, type:'f'}));
    (singerHistory.g||[]).forEach(n => allTags.push({name:n, type:'g'}));
    
    const uniqueTags = [];
    const seen = new Set();
    allTags.forEach(t => {
        if(!seen.has(t.name)) {
            uniqueTags.push(t);
            seen.add(t.name);
        }
    });

    // V71：不再限制顯示數量（原本只顯示前 25 個），全部列出並可搜尋
    const kw = (keyword || "").trim().toLowerCase();
    const shown = kw ? uniqueTags.filter(t => t.name.toLowerCase().includes(kw)) : uniqueTags;

    const countEl = document.getElementById(`tagcount-${rowId}`);
    if(countEl) countEl.textContent = kw ? `${shown.length} / ${uniqueTags.length} 個` : `共 ${uniqueTags.length} 個`;

    if(shown.length === 0) {
        const empty = document.createElement('span');
        empty.style.cssText = "font-size:11px; color:#666;";
        empty.textContent = uniqueTags.length ? "找不到符合的歌手" : "尚無歷史歌手紀錄";
        container.appendChild(empty);
        return;
    }

    shown.forEach(tag => {
        const span = document.createElement('span');
        span.className = `quick-tag t-${tag.type}`;
        span.textContent = tag.name;
        span.onclick = () => {
            const inp = document.getElementById(`input-${rowId}`);
            if(inp) inp.value = tag.name;
            setRowType(rowId, tag.type);
        };
        container.appendChild(span);
    });
};

window.setRowType = function(rowId, type) {
    const row = document.getElementById(`row-${rowId}`);
    if(!row) return;
    row.dataset.type = type;
    row.querySelector('.type-opt.m').classList.remove('active');
    row.querySelector('.type-opt.f').classList.remove('active');
    row.querySelector('.type-opt.g').classList.remove('active');
    
    row.querySelector(`.type-opt.${type}`).classList.add('active');
};

function finalizeSettlement() {
    if(!currentTask) return alert("目前沒有進行中的題目，請先抽取挑戰任務");

    const rows = document.querySelectorAll('.singer-input-row');
    const pending = [];

    rows.forEach(row => {
        // 只取這一列的歌手名稱輸入框（避免抓到搜尋框）
        const input = row.querySelector('.input-field:not(.tag-filter)');
        const name = input ? input.value.trim() : "";
        const type = ['m','f','g'].includes(row.dataset.type) ? row.dataset.type : 'm';
        if(name) pending.push({ name, type });
    });

    if(pending.length === 0) return alert("請至少輸入一位歌手");

    // ===== 累積型題目：先算好獎勵，確認資料無誤才寫入 =====
    let reward = Number(currentTask.n) || 1;
    let collectCommit = null;

    if(currentTask.type === "collect" && COLLECT_META[currentTask.ck]) {
        const ck = currentTask.ck;
        const meta = COLLECT_META[ck];
        const el = document.getElementById('collect-input');
        const raw = el ? el.value.trim() : "";
        if(!normCollect(raw)) return alert(`請輸入這次歌名裡用的【${meta.label}】`);

        reward = calcCollectReward(ck, raw);
        const isNew = !collectHasValue(ck, raw);
        collectCommit = { ck: ck, val: raw, isNew: isNew, label: meta.label };
    }

    // 確認無誤後才寫入，避免中途 return 造成資料不一致
    pending.forEach(({ name, type }) => {
        if(!Array.isArray(singers[type])) singers[type] = [];
        if(!Array.isArray(singerHistory[type])) singerHistory[type] = [];
        singers[type].push(name);
        if(!singerHistory[type].includes(name)) singerHistory[type].push(name);
    });

    if(collectCommit && collectCommit.isNew) {
        if(!Array.isArray(collectLog[collectCommit.ck])) collectLog[collectCommit.ck] = [];
        collectLog[collectCommit.ck].push(collectCommit.val);
    }

    currentTask = null;   // 已完成，題目結束
    persistTask();
    // 先更新畫面與紀錄，再顯示抽卡結果，確保「主畫面張數」一定同步
    drawCards(reward);
    syncData();

    if(collectCommit) {
        const list = getCollectList(collectCommit.ck);
        showToast(collectCommit.isNew
            ? `新的${collectCommit.label}「${collectCommit.val}」！已累積 ${list.length} 個，獲得 ${reward} 張`
            : `${collectCommit.label}「${collectCommit.val}」用過了，獲得 1 張`);
    }
}

// ==================== 圖片與抽卡處理 ====================
function normalizeGroupForFile(group) {
    return group.replace(/ /g, '_').replace(/[^a-zA-Z0-9_]/g, '');
}
function getCardImage(group, member) {
    const safeGroup = normalizeGroupForFile(group);
    const safeMember = member.replace(/ /g, '_');
    return `./images/${safeGroup}_${safeMember}.jpg`;
}

window.handleImgError = function(img, member) {
    img.onerror = null; 
    const safe = encodeURIComponent(String(member || "?")).replace(/'/g, "%27");
    img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400' style='background:%23222;'><text x='50%25' y='50%25' font-size='24' fill='%23ff4081' dominant-baseline='middle' text-anchor='middle'>" + safe + "</text></svg>";
};

function renderDrawResult(cards) {
    const resDiv = document.getElementById('draw-results');
    resDiv.innerHTML = "";
    cards.forEach(p => {
        const wrap = document.createElement('div');
        wrap.className = 'draw-card-wrap' + (p.isNew ? ' is-new' : '');
        wrap.style.cssText = "margin:10px; text-align:center; background:#222; padding:10px; border-radius:8px; border:1px solid var(--accent);";

        if (p.isNew) {
            const badge = document.createElement('div');
            badge.className = 'new-badge';
            badge.textContent = 'NEW';
            wrap.appendChild(badge);
        }

        const img = document.createElement('img');
        img.src = getCardImage(p.g, p.m);
        img.style.cssText = "width:100px; height:140px; background:#333; border-radius:5px; margin-bottom:5px; object-fit:cover;";
        img.onerror = function() { handleImgError(this, p.m); };

        const nameEl = document.createElement('div');
        nameEl.style.cssText = "font-size:12px; font-weight:bold;";
        nameEl.textContent = p.m;

        const groupEl = document.createElement('div');
        groupEl.style.cssText = "font-size:10px; color:#aaa;";
        groupEl.textContent = p.g;

        wrap.append(img, nameEl, groupEl);
        resDiv.appendChild(wrap);
    });
    document.getElementById('draw-modal').style.display = 'flex';
}

function drawCards(count) {
    const pool = [];

    // 防呆：過濾掉已集滿的團體
    for(let g in GIRL_GROUPS) {
        if (!isGroupComplete(g)) {
            GIRL_GROUPS[g].forEach(m => pool.push({g, m, k: getSafeKey(g, m)}));
        }
    }

    if(pool.length === 0) {
        showToast("🎉 恭喜！您已完美集滿目前所有卡片！無法再抽取新卡。");
        showPage('page-home');
        return;
    }

    const drawn = [];
    for(let i=0; i<count; i++) {
        const p = pool[Math.floor(Math.random()*pool.length)];
        const isNew = !collection[p.k];
        collection[p.k] = (collection[p.k] || 0) + 1;
        drawn.push({...p, isNew});
    }
    renderDrawResult(drawn);
}

// 蒐集冊上方：不重複張數 + 重複卡片清單
function renderBookSummary() {
    const box = document.getElementById('book-summary');
    if(!box) return;
    box.innerHTML = "";

    const uniq = countUniqueOwned(collection);
    const dupes = countDupes(collection);

    const title = document.createElement('div');
    title.style.cssText = "font-weight:bold; color:var(--highlight); font-size:14px;";
    title.textContent = `📊 不重複卡片 ${uniq} / ${getTotalMemberCount()} 張`;
    box.appendChild(title);

    const sub = document.createElement('div');
    sub.style.cssText = "font-size:13px; color:var(--gold); margin-top:6px;";
    sub.textContent = `♻️ 重複卡片 ${dupes} 張`;
    box.appendChild(sub);

    const dupeList = [];
    for(let g in GIRL_GROUPS) {
        GIRL_GROUPS[g].forEach(m => {
            const num = collection[getSafeKey(g, m)] || 0;
            if(num > 1) dupeList.push({ g, m, extra: num - 1 });
        });
    }
    dupeList.sort((a, b) => b.extra - a.extra);

    if(dupeList.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = "font-size:12px; color:#888; margin-top:6px;";
        empty.textContent = "目前沒有重複的卡片";
        box.appendChild(empty);
        return;
    }

    const wrap = document.createElement('div');
    wrap.className = "dupe-wrap";
    dupeList.forEach(d => {
        const chip = document.createElement('span');
        chip.className = "dupe-chip";
        chip.textContent = `${d.m}（${d.g}）+${d.extra}`;
        chip.onclick = () => openCardView(d.g, d.m);
        wrap.appendChild(chip);
    });
    box.appendChild(wrap);
}

function renderCollection() {
    renderBookSummary();

    const container = document.getElementById('collection-container');
    if(!container) return;
    
    container.innerHTML = "";
    
    for(let g in GIRL_GROUPS) {
        const isComp = isGroupComplete(g);
        const ownedCount = GIRL_GROUPS[g].filter(m => collection[getSafeKey(g, m)]).length;
        const groupDupes = GIRL_GROUPS[g].reduce((s, m) => {
            const n = collection[getSafeKey(g, m)] || 0;
            return s + (n > 1 ? n - 1 : 0);
        }, 0);
        
        const sec = document.createElement('div');
        sec.className = `group-section ${isComp?'group-complete':''}`;

        // 用 DOM 產生，避免團名／成員名含特殊字元時破版
        const header = document.createElement('div');
        header.className = "group-header";

        const nameEl = document.createElement('div');
        nameEl.className = "group-name";
        nameEl.textContent = isComp ? `${g} 👑` : g;

        const cntEl = document.createElement('div');
        cntEl.style.cssText = "font-size:12px; color:#aaa; text-align:right;";
        cntEl.textContent = `${ownedCount} / ${GIRL_GROUPS[g].length}`;
        if(groupDupes > 0) {
            const d = document.createElement('div');
            d.style.cssText = "font-size:10px; color:var(--gold);";
            d.textContent = `重複 +${groupDupes}`;
            cntEl.appendChild(d);
        }

        header.append(nameEl, cntEl);
        sec.appendChild(header);
        
        const grid = document.createElement('div');
        grid.className = "member-grid";
        
        GIRL_GROUPS[g].forEach(m => {
            const num = collection[getSafeKey(g, m)] || 0;
            
            const card = document.createElement('div');
            card.className = `member-card ${num?'owned':''}${num>1?' has-dupe':''}`;

            const img = document.createElement('img');
            img.className = "card-thumb";
            img.src = getCardImage(g, m);
            img.style.opacity = num ? 1 : 0.3;
            img.style.marginBottom = "5px";
            img.onerror = function() { handleImgError(this, m); };

            const nameDiv = document.createElement('div');
            nameDiv.className = "member-name";
            nameDiv.style.cssText = "font-size:12px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; text-align:center;";
            nameDiv.textContent = num ? m : '?';

            card.append(img, nameDiv);

            if(num > 0) {
                const cnt = document.createElement('div');
                cnt.className = "member-count";
                cnt.style.cssText = num > 1
                    ? "font-size:10px; font-weight:900; color:var(--gold);"
                    : "font-size:10px; color:var(--accent);";
                cnt.textContent = `x${num}`;
                card.appendChild(cnt);
                card.onclick = () => openCardView(g, m);
            }
            grid.appendChild(card);
        });
        sec.appendChild(grid);
        container.appendChild(sec);
    }
}

function openCardView(group, member) {
    const imgEl = document.getElementById('view-img');
    if (imgEl) {
        imgEl.src = getCardImage(group, member);
        imgEl.onerror = function() { handleImgError(this, member); };
    }
    
    document.getElementById('view-name').textContent = member;
    document.getElementById('view-group').textContent = group;
    document.getElementById('card-view-modal').style.display = 'flex';
}

function closeCardView() { document.getElementById('card-view-modal').style.display = 'none'; }

function updateRanking(data) {
    lastRankingData = data || {};
    renderRanking();
}

// 把「雲端資料」與「自己的本機即時狀態」合併後顯示
// 這樣一進新房間或剛抽到卡，自己的名字與張數就會立刻出現
function renderRanking() {
    const list = document.getElementById('ranking-list');
    if (!list) return;
    list.innerHTML = "";

    const merged = {};
    const src = lastRankingData || {};
    for (const k in src) {
        if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
        const v = src[k];
        if (v && typeof v === 'object') merged[k] = Object.assign({}, v, { name: v.name || k });
    }

    if (myName) {
        merged[myName] = Object.assign({}, merged[myName] || {}, {
            name: myName,
            completedGroups: getCompletedGroupCount(),
            collection: collection,
            uniqueCards: countUniqueOwned(collection),
            dupeCards: countDupes(collection),
            isMe: true
        });
    }

    // 只計算「不重複」張數：優先由 collection 精算，沒有才退回同步欄位
    const uniqOf = (p) => {
        if (p && p.collection) return countUniqueOwned(p.collection);
        if (p && typeof p.uniqueCards === 'number') return p.uniqueCards;
        return 0;
    };
    const dupeOf = (p) => {
        if (p && p.collection) return countDupes(p.collection);
        if (p && typeof p.dupeCards === 'number') return p.dupeCards;
        return 0;
    };

    const rows = Object.keys(merged).map(k => merged[k]);
    if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = "font-size:12px; color:#888;";
        empty.textContent = "目前房間內沒有玩家資料";
        list.appendChild(empty);
        return;
    }

    rows
        // 先比 👑，平手再比不重複張數
        .sort((a, b) => (b.completedGroups || 0) - (a.completedGroups || 0)
                     || uniqOf(b) - uniqOf(a))
        .forEach((p, i) => {
            const comp = p.completedGroups || 0;
            const cards = uniqOf(p);
            const dupes = dupeOf(p);

            const row = document.createElement('div');
            row.style.cssText = "display:flex; justify-content:space-between; margin-bottom:5px; gap:8px;";
            if (p.isMe) row.style.color = "var(--highlight)";

            // textContent 防止暱稱注入
            const left = document.createElement('span');
            left.textContent = `${i + 1}. ${p.name || '???'}${p.isMe ? '（我）' : ''}`;
            const right = document.createElement('span');
            right.style.whiteSpace = "nowrap";
            right.textContent = `${comp} 👑 / ${cards} 張（重複 ${dupes}）`;

            row.append(left, right);
            list.appendChild(row);
        });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

function showPage(id) { 
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); 
    const el = document.getElementById(id);
    if(el) el.classList.add('active'); 
    window.scrollTo(0,0);
    // 進入蒐集冊或主畫面時一律重畫，保證兩邊的張數永遠一致
    if(id === 'page-book') renderCollection();
    if(id === 'page-home' && myName) refreshUI();
}

// ==================== 雲端同步診斷 ====================
let diagText = "";

function openDiagnostics() {
    document.getElementById('diag-modal').style.display = 'block';
    runDiagnostics();
}

function diagPrint(lines) {
    diagText = lines.join("\n");
    const out = document.getElementById('diag-out');
    if (out) out.textContent = diagText;
}

function copyDiagnostics() {
    try {
        if (navigator.clipboard) navigator.clipboard.writeText(diagText);
        else {
            const ta = document.createElement('textarea');
            ta.value = diagText; document.body.appendChild(ta);
            ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
        showToast("已複製檢測結果");
    } catch (e) { showToast("複製失敗，請手動選取"); }
}

async function runDiagnostics() {
    const L = [];
    const push = (s) => { L.push(s); diagPrint(L); };

    push("=== K-Pop 蒐集戰 同步檢測 ===");
    push(`時間：${new Date().toLocaleString('zh-TW')}`);
    push(`暱稱：${myName || "(未登入)"}`);
    push(`房號：${myRoom || "(未登入)"}`);
    push(`資料路徑：rooms/${myRoom}/players/${myName}`);
    push(`存檔版本 rev：${dataRev}`);
    push(`連線狀態：${isOnline ? "已連線" : "離線"}`);
    push(`本機備份：不重複 ${countUniqueOwned(collection)} 張、重複 ${countDupes(collection)} 張`);
    push("");

    // 1) 登入狀態
    const u = firebase.auth().currentUser;
    push(u ? `1) 匿名登入：OK（uid ${String(u.uid).slice(0, 8)}…）`
           : "1) 匿名登入：❌ 沒有登入使用者 → 請到 Firebase 主控台 Authentication 啟用「匿名」");

    if (!myName || !myRoom) { push("\n尚未登入房間，請先回登入頁輸入暱稱與房號。"); return; }

    // 2) 讀自己的資料
    try {
        const snap = await db.ref(`rooms/${myRoom}/players/${myName}`).once('value');
        const v = snap.val();
        push(`2) 讀取自己的存檔：OK（雲端 rev=${(v && v.rev) || 0}、不重複 ${countUniqueOwned((v && v.collection) || {})} 張）`);
    } catch (e) {
        const d = describeError(e);
        push(`2) 讀取自己的存檔：❌ ${d.code} - ${d.message}`);
    }

    // 3) 讀房間排行
    try {
        await db.ref(`rooms/${myRoom}/players`).once('value');
        push("3) 讀取房間玩家列表：OK");
    } catch (e) {
        const d = describeError(e);
        push(`3) 讀取房間玩家列表：❌ ${d.code} - ${d.message}`);
        push("   → 規則把讀取權限設在 $player 層，排行榜會看不到別人。讀取權限要設在 rooms 或 players 層。");
    }

    // 4) 最小寫入測試（只寫一個時間戳）
    let minOk = false;
    try {
        await db.ref(`rooms/${myRoom}/players/${myName}`).update({ lastActive: Date.now() });
        minOk = true;
        push("4) 最小寫入測試（1 個欄位）：OK");
    } catch (e) {
        const d = describeError(e);
        push(`4) 最小寫入測試（1 個欄位）：❌ ${d.code} - ${d.message}`);
    }

    // 5) 完整寫入測試
    let fullOk = false;
    try {
        await db.ref(`rooms/${myRoom}/players/${myName}`).update(buildPayload());
        fullOk = true;
        pendingSync = false;
        lastSyncError = null;
        setSyncStatus('ok');
        push("5) 完整存檔寫入測試：OK");
    } catch (e) {
        const d = describeError(e);
        lastSyncError = d;
        setSyncStatus('fail');
        push(`5) 完整存檔寫入測試：❌ ${d.code} - ${d.message}`);
    }

    push("");
    push("=== 判讀 ===");
    if (fullOk) {
        push("✅ 一切正常，紀錄已成功寫入雲端。");
        push("（如果剛才是紅燈，現在已經補傳成功了）");
    } else if (!minOk) {
        push("❌ 連 1 個欄位都寫不進去 → 是「資料庫規則」不允許寫入。");
        push("");
        push("請到 Firebase 主控台 → Realtime Database → 規則，");
        push("貼上以下內容後按「發布」：");
        push("");
        push('{');
        push('  "rules": {');
        push('    "rooms": {');
        push('      "$room": {');
        push('        ".read": "auth != null",');
        push('        ".write": "auth != null"');
        push('      }');
        push('    }');
        push('  }');
        push('}');
        push("");
        push("另外請確認 Authentication → 登入方式 → 「匿名」已啟用。");
        push("提醒：測試模式的規則有 30 天期限，過期後就會變成全部拒絕。");
    } else {
        push("⚠️ 單一欄位寫得進去，但完整存檔寫不進去 →");
        push("通常是規則裡有 .validate 限制，或某個資料值不被接受。");
        push("請把上面的錯誤訊息回報給我。");
    }
    if (lastSyncError) {
        push("");
        push(`最近一次同步錯誤：${lastSyncError.code} - ${lastSyncError.message}`);
    }
}

function closeDrawModal() {
    document.getElementById('draw-modal').style.display = 'none';
    refreshUI();          // 收進口袋後主畫面統計立刻更新
    showPage('page-home');
}
